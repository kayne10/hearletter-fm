[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hearletter-fm"
version = "0.1.0"
description = "Event-driven newsletter-to-private-podcast pipeline."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "boto3>=1.34.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = [
  "packages/domain",
  "packages/utils",
  "services/shared",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/domain",
  "packages/utils",
  "services/shared",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PYI"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

